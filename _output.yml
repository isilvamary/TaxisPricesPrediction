bookdown::gitbook:
  css: style.css
  split_by: chapter
  number_sections: true
  config:
    toc:
      collapse: section
      scroll_highlight: true
      before: |
        <li class="toc-logo"><strong>Precio de las carreras de taxi</strong></li>
    toolbar:
      position: fixed
    edit: null
    download: null
    sharing:
      facebook: false
      twitter: false
      all: false
    fontsettings:
      theme: white
      family: sans
      size: 2
